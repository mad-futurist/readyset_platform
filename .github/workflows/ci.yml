name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: readyset_test
          POSTGRES_USER: readyset
          POSTGRES_PASSWORD: readyset
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U readyset -d readyset_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://readyset:readyset@localhost:5432/readyset_test
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: "0.12.16", python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check app tests scripts
      - run: uv run --frozen mypy app
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic check
      - run: uv run --frozen pytest -m "not storage and not redis" --cov=app --cov-report=term-missing

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with: { version: "0.12.16", python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -m "worker and not postgres"

  vector-retrieval-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: readyset_vector_test
          POSTGRES_USER: readyset
          POSTGRES_PASSWORD: readyset
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U readyset -d readyset_vector_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://readyset:readyset@localhost:5432/readyset_vector_test
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with: { version: "0.12.16", python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen alembic check
      - run: uv run --frozen pytest -m vector

  storage-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      S3_TEST_ENDPOINT_URL: http://localhost:9000
      S3_TEST_ACCESS_KEY: readyset
      S3_TEST_SECRET_KEY: readyset-local-only
      S3_TEST_BUCKET: readyset-ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: "0.12.16", python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - name: Start pinned MinIO
        run: >-
          docker run -d --name readyset-minio -p 9000:9000
          -e MINIO_ROOT_USER=readyset -e MINIO_ROOT_PASSWORD=readyset-local-only
          quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs readyset-minio
          exit 1
      - run: uv run --frozen pytest -m storage

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      ENVIRONMENT: test
      REDIS_TEST_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: "0.12.16", python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -m redis

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: "0.12.16", python-version: "3.13" }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: uv sync --project apps/api --frozen
      - run: npm ci
      - run: uv run --project apps/api --frozen python apps/api/scripts/export_openapi.py
      - run: npm run generate:api-client
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t readyset-api:ci apps/api
      - run: docker build -t readyset-web:ci -f apps/web/Dockerfile .
      - run: docker build -t readyset-worker:ci -f apps/worker/Dockerfile .
      - name: Verify non-root runtime users
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' readyset-api:ci)" = "readyset"
          test "$(docker image inspect --format '{{.Config.User}}' readyset-web:ci)" = "node"
          test "$(docker image inspect --format '{{.Config.User}}' readyset-worker:ci)" = "readyset"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with: { version: "0.12.16", python-version: "3.13" }
      - run: uv sync --project apps/api --frozen
      - name: Live packaged ingestion and retrieval acceptance
        run: |
          docker network create readyset-acceptance
          docker run -d --name acceptance-postgres --network readyset-acceptance \
            -e POSTGRES_DB=readyset -e POSTGRES_USER=readyset -e POSTGRES_PASSWORD=readyset \
            pgvector/pgvector:0.8.2-pg17
          docker run -d --name acceptance-minio --network readyset-acceptance \
            -e MINIO_ROOT_USER=readyset -e MINIO_ROOT_PASSWORD=readyset-local-only \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in {1..30}; do
            docker exec acceptance-postgres pg_isready -U readyset && break
            sleep 1
          done
          cat > /tmp/readyset-acceptance.env <<'ENV'
          ENVIRONMENT=test
          DATABASE_URL=postgresql+psycopg://readyset:readyset@acceptance-postgres:5432/readyset
          STORAGE_ENDPOINT_URL=http://acceptance-minio:9000
          STORAGE_BUCKET=readyset-acceptance
          AI_ENABLED=true
          EMBEDDING_PROVIDER=fake
          CHAT_PROVIDER=fake
          ENV
          docker run --rm --network readyset-acceptance --env-file /tmp/readyset-acceptance.env readyset-api:ci alembic upgrade head
          docker run -d --name acceptance-api --network readyset-acceptance -p 58000:8000 --env-file /tmp/readyset-acceptance.env readyset-api:ci
          docker run -d --name acceptance-worker --network readyset-acceptance --env-file /tmp/readyset-acceptance.env readyset-worker:ci
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:58000/readyz; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          uv run --project apps/api --frozen python apps/api/scripts/acceptance_m2.py --base-url http://localhost:58000
          docker exec acceptance-worker python worker.py --health
      - name: Acceptance diagnostic logs
        if: failure()
        run: |
          docker logs acceptance-api || true
          docker logs acceptance-worker || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: "0.12.16", python-version: "3.13" }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: uv sync --project apps/api --frozen --extra dev
      - run: uv run --project apps/api --frozen pip-audit
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Scan committed history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          detect --source=/repo --redact --no-banner
