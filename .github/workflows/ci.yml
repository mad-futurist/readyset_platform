name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: readyset_test
          POSTGRES_USER: readyset
          POSTGRES_PASSWORD: readyset
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U readyset"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://readyset:readyset@localhost:5432/readyset_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest --cov=app --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate:api-client
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
